[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-media-server"
version = "0.0.1"
description = "The app's API: sessions, replies, threads and the auth in front of them."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# Stdlib HTTP only, like the canvas it was split out of. `visual` depends on
# this package, never the other way round (docs/proposals/2026-09-21-server-package.md).
# websockets (BSD) connects only to Codex's existing local control socket.
# icalendar (BSD; it brings python-dateutil) reads calendar sources
# (calendar_sources.py), imported only when one is configured.
# httpx (BSD) fetches the page a shared link points at (read_it.py).
# opening-hours-py (MIT OR Apache-2.0; a Rust wheel, abi3, glibc and musl,
# x86_64 and arm) reads OSM opening_hours for /map/places (map_places.py).
# vobject (Apache-2.0): the CardDAV source's vCards (contacts_carddav.py).
# cryptography (Apache-2.0 OR BSD-3-Clause): the ES256 signature on a review
# posted to Mangrove (map_reviews.py).
dependencies = ["agent-media-core", "httpx>=0.27", "icalendar>=6", "websockets>=15,<18",
                "opening-hours-py>=2.1", "vobject>=0.9.9", "cryptography>=42",
                # Wikivoyage's listings on the Map's place card (map_wiki.py), MIT.
                "mwparserfromhell>=0.6",
                # The screen of a sign-in the server holds in a pty
                # (terminals.py), LGPL-3.0, imported unmodified (NOTICE).
                "pyte>=0.8",
                # LiteLLM's and CLIProxyAPI's configs, for GET /gateway (gateway.py), MIT.
                "pyyaml>=6"]

[project.optional-dependencies]
# Tags by meaning for the tags sheet's Auto (tag_embed.py): a small local
# embedding model, ONNX, no PyTorch. Without it, Auto matches words.
tags-embed = ["fastembed>=0.9"]
# The Map's cameras from a weekly OpenStreetMap file (map_osm.py refresh):
# pyosmium, BSD-2.
map-extract = ["osmium>=4"]

[project.scripts]
# The quick tunnel (tunnel.py); `sasonica tunnel` runs it.
media-tunnel = "agent_media_server.tunnel:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_media_server"]

# The type checker (CI's "types" job), over the modules whose records are
# typed so far, a module at a time
# (docs/proposals/2026-11-19-typed-records-and-settings.md).
[tool.mypy]
python_version = "3.11"
files = [
    "src/agent_media_server/speech.py",
    "src/agent_media_server/session_records.py",
    "src/agent_media_server/sessions.py",
    "src/agent_media_server/mail_accounts.py",
    "src/agent_media_server/mail_remote.py",
    "src/agent_media_server/forge.py",
    "src/agent_media_server/contacts_carddav.py",
    "src/agent_media_server/place_share.py",
]
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
# core is read from its source (it ships no py.typed), so its types reach here.
mypy_path = "../core/src"
