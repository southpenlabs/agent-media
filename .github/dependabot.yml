# Weekly dependency updates: minor and patch grouped into one PR per
# ecosystem, majors one each (agent-media docs/proposals/2026-11-17-dependency-upgrades.md).
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/packages/*"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Melbourne
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Melbourne
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
